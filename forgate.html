<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Fitness - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-4 relative overflow-hidden">

    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-orange-600/20 via-zinc-950 to-zinc-950 -z-10"></div>

    <div class="w-full max-w-md bg-zinc-900/90 backdrop-blur-md border border-zinc-800 p-8 rounded-2xl shadow-2xl">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-wider text-white">
                MAX<span class="text-orange-500">FITNESS</span>
            </h1>
            <p class="text-zinc-400 text-sm mt-2">Reset your password to get back to the grind.</p>
        </div>

        <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-sm font-medium text-center"></div>

        <form id="forgotPasswordForm" class="space-y-4">
            
            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400">Registered Gmail Address</label>
                <div class="flex gap-2 mt-1">
                    <input type="email" id="email" required placeholder="yourname@gmail.com"
                        class="flex-1 px-4 py-3 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
                    <button type="button" id="sendCodeBtn" onclick="sendResetCode()"
                        class="px-3 bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs rounded-xl tracking-wide whitespace-nowrap transition duration-150">
                        Send Code
                    </button>
                </div>
            </div>

            <div>
                <label for="otp" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400">6-Digit Reset Code</label>
                <input type="text" id="otp" required maxlength="6" placeholder="Enter 6-digit OTP"
                    class="w-full px-4 py-3 mt-1 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white tracking-widest placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
            </div>

            <div>
                <label for="newPassword" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400">New Password</label>
                <input type="password" id="newPassword" required placeholder="Enter new password"
                    class="w-full px-4 py-3 mt-1 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
            </div>

            <button type="submit"
                class="w-full py-3.5 mt-2 bg-orange-600 hover:bg-orange-500 active:bg-orange-700 text-white font-bold rounded-xl tracking-wide shadow-lg shadow-orange-600/20 transition duration-200 transform active:scale-[0.98]">
                UPDATE PASSWORD
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-zinc-400">
            Remembered your credentials? 
            <a href="signin.html" class="text-orange-500 font-semibold hover:text-orange-400 hover:underline ml-1 transition">
                Sign In
            </a>
        </div>
    </div>

    <script>
        const BACKEND_URL = "http://127.0.0.1:8000/api";
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, isSuccess = true) {
            alertBox.textContent = message;
            alertBox.className = `mb-4 p-3 rounded-xl text-sm font-medium text-center ${
                isSuccess ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'
            }`;
        }

        // 1. Send Password Reset OTP Request
        async function sendResetCode() {
            const email = document.getElementById('email').value;
            const codeBtn = document.getElementById('sendCodeBtn');

            if (!email) {
                showAlert("Please enter your registered email address.", false);
                return;
            }

            codeBtn.disabled = true;
            codeBtn.textContent = "Sending...";

            try {
                const response = await fetch(`${BACKEND_URL}/forgot-password/request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message, true);
                    let cooldown = 60;
                    const timer = setInterval(() => {
                        cooldown--;
                        if (cooldown <= 0) {
                            clearInterval(timer);
                            codeBtn.disabled = false;
                            codeBtn.textContent = "Resend Code";
                        } else {
                            codeBtn.textContent = `Resend (${cooldown}s)`;
                        }
                    }, 1000);
                } else {
                    showAlert(data.detail || "Error requesting reset code.", false);
                    codeBtn.disabled = false;
                    codeBtn.textContent = "Send Code";
                }
            } catch (error) {
                showAlert("Cannot reach the backend server.", false);
                codeBtn.disabled = false;
                codeBtn.textContent = "Send Code";
            }
        }

        // 2. Form Submit: Process Password Reset
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const otp = document.getElementById('otp').value;
            const newPassword = document.getElementById('newPassword').value;

            try {
                const response = await fetch(`${BACKEND_URL}/forgot-password/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, new_password: newPassword })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert("Password updated successfully! Redirecting to login...", true);
                    document.getElementById('forgotPasswordForm').reset();
                } else {
                    showAlert(data.detail || "Reset failed. Please check your code.", false);
                }
            } catch (error) {
                showAlert("Connection error. Could not reset password.", false);
            }
        });
    </script>
</body>
</html>
