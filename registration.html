<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Fitness - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-4 relative overflow-hidden">

    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-orange-600/20 via-zinc-950 to-zinc-950 -z-10"></div>

    <div class="w-full max-w-md bg-zinc-900/90 backdrop-blur-md border border-zinc-800 p-8 rounded-2xl shadow-2xl">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-wider text-white">
                MAX<span class="text-orange-500">FITNESS</span>
            </h1>
            <p class="text-zinc-400 text-sm mt-2">Create your account and start training.</p>
        </div>

        <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-sm font-medium text-center"></div>

        <form id="registerForm" class="space-y-4">
            
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400">Username</label>
                <input type="text" id="username" required placeholder="Choose a username"
                    class="w-full px-4 py-3 mt-1 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400">Gmail Address</label>
                <div class="flex gap-2 mt-1">
                    <input type="email" id="email" required placeholder="yourname@gmail.com"
                        class="flex-1 px-4 py-3 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
                    <button type="button" id="sendOtpBtn" onclick="sendOTP()"
                        class="px-3 bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs rounded-xl tracking-wide whitespace-nowrap transition duration-150">
                        Send OTP
                    </button>
                </div>
            </div>

            <div>
                <label for="otp" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400">6-Digit Verification Code</label>
                <input type="text" id="otp" required maxlength="6" placeholder="Enter 6-digit OTP"
                    class="w-full px-4 py-3 mt-1 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white tracking-widest placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400">Password</label>
                <input type="password" id="password" required placeholder="••••••••"
                    class="w-full px-4 py-3 mt-1 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
            </div>

            <button type="submit"
                class="w-full py-3.5 mt-2 bg-orange-600 hover:bg-orange-500 active:bg-orange-700 text-white font-bold rounded-xl tracking-wide shadow-lg shadow-orange-600/20 transition duration-200 transform active:scale-[0.98]">
                REGISTER NOW
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-zinc-400">
            Already have an account? 
            <a href="signin.html" class="text-orange-500 font-semibold hover:text-orange-400 hover:underline ml-1 transition">
                Sign In
            </a>
        </div>
    </div>

    <script>
        const BACKEND_URL = "http://127.0.0.1:8000/api";
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, isSuccess = true) {
            alertBox.textContent = message;
            alertBox.className = `mb-4 p-3 rounded-xl text-sm font-medium text-center ${
                isSuccess ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'
            }`;
        }

        // 1. Send OTP Request
        async function sendOTP() {
            const email = document.getElementById('email').value;
            const otpBtn = document.getElementById('sendOtpBtn');

            if (!email) {
                showAlert("Please enter a valid email address first.", false);
                return;
            }

            otpBtn.disabled = true;
            otpBtn.textContent = "Sending...";

            try {
                const response = await fetch(`${BACKEND_URL}/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message, true);
                    // Start a simple 60s cooldown style visual for "Resend"
                    let cooldown = 60;
                    const timer = setInterval(() => {
                        cooldown--;
                        if (cooldown <= 0) {
                            clearInterval(timer);
                            otpBtn.disabled = false;
                            otpBtn.textContent = "Resend OTP";
                        } else {
                            otpBtn.textContent = `Resend (${cooldown}s)`;
                        }
                    }, 1000);
                } else {
                    showAlert(data.detail || "Error sending code.", false);
                    otpBtn.disabled = false;
                    otpBtn.textContent = "Send OTP";
                }
            } catch (error) {
                showAlert("Cannot reach the server.", false);
                otpBtn.disabled = false;
                otpBtn.textContent = "Send OTP";
            }
        }

        // 2. Form Submit Registration Request
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const otp = document.getElementById('otp').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${BACKEND_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, otp, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert("Account created successfully! Redirecting...", true);
                    document.getElementById('registerForm').reset();
                } else {
                    showAlert(data.detail || "Registration failed.", false);
                }
            } catch (error) {
                showAlert("Connection error. Could not register account.", false);
            }
        });
    </script>
</body>
</html>
